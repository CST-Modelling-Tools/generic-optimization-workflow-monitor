[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-optimization-workflow-monitor"
version = "0.1.0"
description = "Independent desktop monitoring framework for GOW optimization runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
gow-monitor = "gow_monitor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
